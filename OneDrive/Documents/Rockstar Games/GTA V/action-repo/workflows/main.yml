name: Trigger Webhook

on:
  push:
    branches:
      - main

jobs:
  webhook_trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Webhook
        run: |
          curl -X POST https://d2a9b90a6614.ngrok-free.app/webhook \
          -H "Content-Type: application/json" \
          -d '{"actor": "Kapil-Shelke", "action": "push", "timestamp": "'$(date)'"}'